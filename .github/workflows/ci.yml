name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://trustbridge:trustbridge@localhost:5432/trustbridge?schema=public
      AUTH_SECRET: ci-secret-ci-secret-ci-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DEMO_MODE: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trustbridge
          POSTGRES_PASSWORD: trustbridge
          POSTGRES_DB: trustbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
