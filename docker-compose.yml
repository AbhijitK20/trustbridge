services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustbridge
      POSTGRES_PASSWORD: trustbridge
      POSTGRES_DB: trustbridge
    ports:
      - "5432:5432"
    volumes:
      - trustbridge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trustbridge-postgres:
